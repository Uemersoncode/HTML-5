<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias em HTML 5!</title>
</head>
<body>
    <h1>Imagens Dinâmicas</h1>
    <p>Tente abrir esse site em vários dispositivos diferentes ou simplesmente aumenta e diminua o tamanho do seu navegador.</p>
    <picture>
        <source media="(max-width:750px )" srcset="imagens/foto-p.png" type="image/png">
        <source media="(max-width: 1050px )" srcset="imagens/foto-m" type="image/png">
       <img src="imagens/foto-w.png" alt="Imagem flexível">
    </picture>
    <h1>Reproduzindo áudio</h1>
    <p>Vamos aprender a reproduzir áudios em Html 5.</p>
    <audio src="midia/Quem de Nós Dois - Léo Foguete(MP3_70K).mp3" controls autoplay></audio>
    <audio preload="metadata" autoplay controls loop>
      <source src="midia/Xande de Pilares - Gratidão (Ao Vivo No Rio De Janeiro _ 2020)(MP3_320K).mp3" type="audio/mpeg"> 
      <source src="midia/Xande de Pilares - Gratidão (Ao Vivo No Rio De Janeiro _ 2020)(MP3_320K).ogg" type="audio/ogg"> 
      <source src="midia/Xande de Pilares - Gratidão (Ao Vivo No Rio De Janeiro _ 2020)(MP3_320K).wav" type="audio/wav">
      <p>Infelizmente seu navegador não consegue reproduzir áudio. <a href="midia/Xande de Pilares - Gratidão (Ao Vivo No Rio De Janeiro _ 2020)(MP3_320K).mp3">Clique aqui para baixar o arquivo MP3.</a> </p>
    </audio>
    
</body>
</html>
