<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner {
         background-color: aqua;
         display: flex;
         flex-flow:  wrap-reverse ;
        } 

        div.item {
            background-color: blueviolet;
            border: 2px solid black;
            text-align: center;
            flex: auto;
        }
    </style>
</head>
<body>
     <div class="conteiner">
        <div class="item">Exeemplo de bloco A</div>
        <div class="item">Exeemplo de bloco B</div>
        <div class="item">Exeemplo de bloco C</div>
        <div class="item">Exeemplo de bloco D</div>
        <div class="item">Exeemplo de bloco E</div>
        <div class="item">Exeemplo de bloco F</div>
        <div class="item">Exeemplo de bloco G</div>

     </div>
    
</body>
</html>
