<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulas</title>
</head>
<body>
    <h1>Teste de formularios</h1>
    <form action="cadastro.php" method="post">
      <p>
        <label for="iusu"> Úsuario:</label>
        <input type="text" name="usu" id="iusu" required minlength="6" maxlength="10" size="12" placeholder="nome do úsuario*">
      </p>  
      <p>
        <label for="isen"> Senha:</label>
        <input type="password" name="sen" id="isen" minlength="8" maxlength="16" size="8" placeholder="minímo 8 letras">
      </p>
      <p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
      </p>
    </form>
    
</body>
</html>
