<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario</title>
</head>
<body>
    <h1>Teste de formulários</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <p>
            <label for="inome">Nome:</label>
            <input type="text" name="nome" id="inome" required maxlength="22" placeholder="Nome completo*" autocomplete="name">
        </p>
        <p>
            <label for="imedia"> Média:</label>
            <input type="number" name="media" id="imedia" min="0" max="5" placeholder="0 a 10*" step="0.1">
        </p>
        <p>
            <label for="imes"> Período Letivo:</label>
            <input type="month" name="mes" id="imes" value="2026-08">
        </p>
        <p>
         <label for="idia">Dia da Prova:</label>
         <input type="date" name="dia" id="idia" value="2021-06-21">
        </p>
        <p>
            <label for="ihora"> Hora da Prova:</label>
            <input type="time" name="hora" id="ihora">
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
    
</body>
</html>
