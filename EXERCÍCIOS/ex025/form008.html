<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Output</title>
</head>
<body>
    <h1>Exemplos </h1>
    <form action="cadastro.php" method="get">
        <p>
            <label for="ini">Número 1:</label>
            <input type="number" name="número" id="ini" min="0" max="50" required oninput="isoma.innerHTML = Number(ini.value) + Number(ini.value)">
        </p>
        <p>
            <label for="ini2"> Número 2:</label>
            <input type="number" name="número" id="ini2" min="0" max="50" required oninput="isoma.innerHTML = Number(ini.value) + Number(ini.value)">
        </p>
        <p>
            <label for = "isoma"> Soma:</label>
            <output name="soma" id="isoma">0</output>  
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
    
</body>
</html>
