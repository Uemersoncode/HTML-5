<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de caixas</title>
    <style>
        h1 { /* box-level*/
            background-color: rgba(85, 107, 47, 0.411);

            height: 400px;
            width: 300px;

            border: 10px solid darkgrey;

            padding: 10px 10px 10px 10px;

            margin: 20px;
            outline: 18px dashed rgba(0, 0, 0, 0.61);
            
        
           
        }

        a { /*inline - level*/

           border-width:2px ; 
           border-style: dashed;
           border-color: rgba(124, 76, 14, 0.568);
           margin: 30px;
          

           outline-width: 1px;
           outline-style: dashed;
           outline-color: blueviolet;
        }
    </style>
</head>
<body>
    <h1>Exemplos de caixas box - level</h1>
    <p>Parágrafos também são exemplos de box - level,mas o <a href="#">links são exemplos de caixas inline-level</a>.Vamos vê como tudo isso funciona.</p>
</body>
</html>
